name: Tests

# Lint and unit tests on every push and pull request. The tests run Bronze,
# Silver and Gold, and the Dagster asset checks, on a few hand-made rows,
# including a case where a blocking check must stop bad Silver reaching Gold.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install the dependencies
        run: pip install -r requirements-test.txt ruff

      - name: Lint
        run: ruff check .

      - name: Run the tests
        run: pytest
